<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Training Plans</title>
<style>
  :root{--bg:#0f0f0f;--bg2:#181818;--bg3:#222222;--bg4:#2a2a2a;--border:#2e2e2e;--border2:#383838;--text:#f0f0f0;--text2:#a0a0a0;--text3:#606060;--accent:#f0f0f0;--accent-dim:#2a2a2a;--red:#f07060;--red-dim:#2a1510;--blue:#60a8f0;--blue-dim:#0a1e30;--purple:#a078f0;--purple-dim:#1a1030;--orange:#f0a060;--orange-dim:#2a1a08;--teal:#50d0b0;--teal-dim:#083020;--radius:14px;--radius-sm:8px;--font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:100px}
  .top-nav{position:sticky;top:0;z-index:100;background:rgba(15,15,15,0.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 16px}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:52px}
  .nav-title{font-size:16px;font-weight:600;letter-spacing:-0.3px;color:var(--text)}
  .plan-switcher{display:flex;gap:4px;background:var(--bg3);border-radius:10px;padding:3px}
  .psw{padding:5px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .15s;border:none;background:transparent}
  .psw.on{background:var(--bg4);color:var(--text)}
  .plan-view{display:none}
  .plan-view.on{display:block}
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 16px 4px}
  .stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px}
  .stat-label{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
  .stat-val{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-0.5px}
  .tab-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;white-space:nowrap;padding:14px 16px 2px}
  .tab-scroll::-webkit-scrollbar{display:none}
  .tab-pill{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:99px;font-size:13px;font-weight:500;cursor:pointer;margin-right:6px;border:1px solid var(--border);color:var(--text2);background:transparent;transition:all .15s;white-space:nowrap}
  .tab-pill.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
  .phase-panel{display:none;padding:12px 16px 0}
  .phase-panel.on{display:block}
  .phase-header{margin-bottom:14px}
  .phase-name{font-size:20px;font-weight:700;letter-spacing:-0.5px;color:var(--text)}
  .phase-sub{font-size:13px;color:var(--text2);margin-top:3px;line-height:1.5}
  .phase-time{display:inline-flex;align-items:center;gap:5px;margin-top:8px;background:var(--bg3);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--text2)}
  .phase-time strong{color:var(--accent);font-weight:600}
  .infobar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 13px;font-size:13px;color:var(--text2);margin-bottom:12px;line-height:1.55}
  .sec-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin:18px 0 8px;padding-left:2px}
  .excard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;transition:border-color .15s}
  .excard.open{border-color:var(--border2)}
  .ex-head{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;cursor:pointer;user-select:none}
  .ex-num{font-size:11px;color:var(--text3);min-width:18px;padding-top:3px;font-variant-numeric:tabular-nums}
  .ex-main{flex:1;min-width:0}
  .ex-name{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-0.2px;line-height:1.3}
  .ex-dose{font-size:13px;color:var(--text2);margin-top:3px}
  .ex-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;letter-spacing:.03em}
  .t-back{background:var(--purple-dim);color:var(--purple)}
  .t-chest{background:var(--red-dim);color:var(--red)}
  .t-shoulder{background:var(--teal-dim);color:var(--teal)}
  .t-arms{background:var(--orange-dim);color:var(--orange)}
  .t-core{background:#201020;color:#d080d0}
  .t-legs{background:#1e2e08;color:#a8d050}
  .t-carry{background:#1a1a10;color:#c0b840}
  .t-choice{background:var(--blue-dim);color:var(--blue)}
  .t-posture{background:var(--purple-dim);color:#b090f0}
  .t-spine{background:var(--teal-dim);color:var(--teal)}
  .t-ankle{background:#1e2e08;color:#a8d050}
  .t-hip{background:var(--orange-dim);color:var(--orange)}
  .t-knee{background:var(--blue-dim);color:var(--blue)}
  .t-handstand{background:#201030;color:#c090f0}
  .t-splits{background:#301010;color:#f08070}
  .t-mobility{background:#1a1a1a;color:#909090}
  .t-warmup{background:#0a2020;color:#50d0b0}
  .ex-chevron{font-size:18px;color:var(--text3);flex-shrink:0;transition:transform .2s;padding-top:1px;line-height:1}
  .excard.open .ex-chevron{transform:rotate(180deg)}
  .ex-badges{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
  .badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.04em}
  .badge-wt{background:#1a1030;color:var(--purple)}
  .badge-exp{background:#2a1a08;color:var(--orange)}
  .ex-body{display:none;border-top:1px solid var(--border);padding:13px 14px}
  .excard.open .ex-body{display:block}
  .ex-section{margin-bottom:12px}
  .ex-section:last-child{margin-bottom:0}
  .ex-blabel{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
  .ex-btext{font-size:14px;color:var(--text2);line-height:1.6}
  .ex-btext.bright{color:var(--text)}
  .choice-box{background:var(--blue-dim);border-radius:var(--radius-sm);padding:10px 12px;margin-top:8px}
  .choice-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:5px}
  .choice-opts{font-size:13px;color:#90c0f0;line-height:1.7}
  .timing-chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 14px}
  .tchip{background:var(--bg3);border-radius:99px;padding:5px 11px;font-size:12px;color:var(--text2)}
  .tchip strong{color:var(--text);font-weight:600}
  .lpad{padding:0 16px}
  .bottom-pad{height:32px}
</style>
</head>
<body>
<div class="top-nav">
  <div class="nav-inner">
    <div class="nav-title">Gym Plans</div>
    <div class="plan-switcher">
      <button class="psw on" onclick="switchPlan('prehab')">Prehab</button>
      <button class="psw" onclick="switchPlan('lifting')">Lifting</button>
    </div>
  </div>
</div>

<div class="plan-view on" id="plan-prehab">
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Time</div><div class="stat-val">~90m</div></div>
    <div class="stat-card"><div class="stat-label">Phases</div><div class="stat-val">6</div></div>
    <div class="stat-card"><div class="stat-label">Exercises</div><div class="stat-val">30</div></div>
    <div class="stat-card"><div class="stat-label">Days/wk</div><div class="stat-val">3×</div></div>
  </div>
  <div class="tab-scroll" id="prehab-tabs"></div>
  <div id="prehab-panels"></div>
</div>

<div class="plan-view" id="plan-lifting">
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Day A</div><div class="stat-val">~72m</div></div>
    <div class="stat-card"><div class="stat-label">Day B</div><div class="stat-val">~68m</div></div>
    <div class="stat-card"><div class="stat-label">Day C</div><div class="stat-val">~76m</div></div>
    <div class="stat-card"><div class="stat-label">Days/wk</div><div class="stat-val">3×</div></div>
  </div>
  <div class="tab-scroll" id="lifting-tabs"></div>
  <div id="lifting-panels"></div>
</div>

<div class="bottom-pad"></div>

<script>
const prehabPhases=[
  {name:"Soft tissue",time:"~20 min",sub:"Warm up with the sled, then release tissue density before loading.",exercises:[
    {name:"Sled push + pull",dose:"5 × push + 5 × pull, alternating",tags:["warmup","knee"],
      cues:"Moderate effort — this is a warm-up, not a sprint. Push: hands on handles, hips low, drive through the full foot. Pull: face away from sled, walk forward pulling with straight arms or over the shoulder.",
      purpose:"Elevates heart rate and core temperature. Sled work loads the quad and VMO with minimal joint stress since there's no eccentric component — excellent knee prehab."},
    {name:"Band shoulder mobility",dose:"90 sec each side",tags:["shoulder","mobility"],
      cues:"Hold a band with both hands wider than shoulder-width. Keep arms straight and pass the band overhead and behind your back in a full arc. Go slow — don't force range. Narrow your grip gradually as mobility improves.",
      purpose:"Opens the shoulder capsule through full rotation range before any loading. Especially important for overhead athletes — prepares the joint for everything that follows."},
    {name:"Band chest stretch",dose:"90 sec",tags:["chest","shoulder"],
      cues:"Anchor band behind you at shoulder height. Hold one or both ends, step forward until you feel tension across the chest. Stand tall, arms back, let the chest open fully. Breathe into the stretch.",
      purpose:"Opens the anterior chest and pec minor before any pressing or pulling work. Directly counters the rounded shoulder pattern from daily sitting and screen use."},
    {name:"Lacrosse ball — posterior shoulder",dose:"90 sec each side",tags:["shoulder"],
      cues:"Pin ball between shoulder blade and wall or floor. Move your arm slowly through different positions while pinned — overhead, across body, by your side. Breathe and let the tissue soften.",
      purpose:"Infraspinatus and teres minor release — rotator cuff health and posterior capsule mobility. More time here to properly address the tissue given your SLAP history."},
    {name:"Foam roll — glutes & piriformis",dose:"45 sec each side",tags:["hip","spine"],
      cues:"Cross ankle over opposite knee (figure-4). Sink into the piriformis. This will be uncomfortable — breathe through it.",
      purpose:"Hip external rotator release. Tight glutes restrict squat depth and compress the lumbar spine. Directly addresses APT compensation patterns."},
    {name:"Foam roll — calves & peroneals",dose:"45 sec each leg",tags:["ankle"],
      cues:"Slow pass — not fast rolling. Rotate foot in and out to hit different heads (gastrocnemius, soleus, peroneals on outer shin).",
      purpose:"Tight calves are the #1 limiter of ankle dorsiflexion. Cannot get an Asian squat without this. Also critical for soccer ankle stability."},
  ]},
  {name:"Mobility",time:"~18 min",sub:"Take joints through full active range. Build usable mobility — range you can control under load.",exercises:[
    {name:"Chin tucks — supine",dose:"2 × 12, 2 sec hold",tags:["posture"],
      cues:"Flatten the back of your neck into the floor — not a nod. Think 'make a double chin.' Hold 2 sec. Feel the deep neck flexors engage.",
      purpose:"Directly counters forward head posture by retraining the deep cervical flexors. The foundational posture exercise."},
    {name:"Cat-cow",dose:"2 × 10 slow reps",tags:["spine"],
      cues:"Lead with the tailbone — not just lumbar. Full spinal wave from sacrum to neck. Breathe in on cow (extension), out on cat (flexion). Slow and deliberate.",
      purpose:"Full spinal segmentation and motor control. Improves independent control of each spinal segment — critical for avoiding butt wink and lower back pain."},
    {name:"Thread-the-needle",dose:"5 × 3 sec hold, each side",tags:["spine","mobility"],
      cues:"Anchor the top arm firmly to the floor. Rotate from the mid-back — not the neck or lumbar. Work both sides equally.",
      purpose:"Thoracic rotation mobility. Critical for volleyball swing mechanics and soccer pivoting."},
    {name:"Lat stretch",dose:"3 × 30 sec each side",tags:["shoulder","mobility"],
      cues:"Kneel facing a wall or cable. Extend one arm overhead, hand on wall. Sit back into your hips while keeping the arm extended. Feel the pull along the side of your ribcage and armpit. Posterior tilt the pelvis to maximise the stretch.",
      purpose:"Targets lat length — a primary limiter of your towel test and overhead shoulder range. Lats internally rotate the shoulder and limit overhead range when tight."},
    {name:"Ankle CARs",dose:"10 circles each direction, each ankle",tags:["ankle"],
      cues:"Slow and deliberate — 3+ seconds per full circle. Maximise range at the ankle specifically; don't let the knee or hip compensate. Joint nutrition.",
      purpose:"Daily joint mobility work for the ankle. Key driver for Asian squat progress. Do this even on rest days."},
    {name:"Wall ankle stretch",dose:"5 × 5 sec each side",tags:["ankle"],
      cues:"Keep heel completely flat. Push knee toward your pinky toe. Track how far your foot is from the wall — this is your progress metric.",
      purpose:"Targets ankle dorsiflexion specifically — the primary limiter for Asian squat and soccer cutting mechanics."},
    {name:"Assisted deep squat hold",dose:"3 × 30 sec",tags:["ankle","hip","spine"],
      cues:"Hold a cable tower or post lightly. Sit as low as possible — heels flat ideally. Elevate heels on plates if needed; reduce elevation weekly. Breathe deep into your belly.",
      purpose:"Integrates ankle dorsiflexion, hip mobility, and lumbar decompression simultaneously. Most efficient single exercise for your Asian squat goal."},
    {name:"Jefferson curl",dose:"2 × 6, very slow",tags:["spine","mobility"],
      cues:"Tuck chin first, then curl spine vertebra by vertebra all the way down. Knees soft. Hang at the bottom — breathe. Roll back up from the tailbone. Use very light weight (10–20 lb max). This is a stretch, not a strength move.",
      purpose:"Loaded posterior chain flexibility. Directly addresses butt wink and lower back pain when bending. Trains the exact range where your back currently hurts — safely and progressively."},
  ]},
  {name:"Activation",time:"~13 min",sub:"Wake up chronically underused muscles before loading. Low weight, high intent.",exercises:[
    {name:"W-Y-T raises",dose:"2 × 10 each letter",tags:["posture","shoulder"],
      cues:"Prone on incline bench. Before each rep: depress your traps first. W: elbows wide, thumbs up. Y: arms at 45°, thumbs up. T: arms straight out, thumbs up. No shrugging at any point.",
      purpose:"Targets lower trapezius, mid trap, and rhomboids — the exact muscles inhibited by forward head posture. Directly addresses your identified weakness."},
    {name:"Lying external rotation",dose:"2 × 15 each arm",tags:["shoulder"],
      cues:"Lie on your side, elbow bent at 90°, upper arm pinned to your side. Rotate the forearm upward slowly. Pause at end range. Control the return. No compensation at the shoulder or trunk.",
      purpose:"Rotator cuff strength for both shoulders. Lying position fully isolates the external rotators — no cheating possible. Critical prehab for an overhead athlete."},
    {name:"Dead bug",dose:"2 × 8 each side",tags:["core","spine"],
      cues:"Lower back completely flat — press it into the floor and keep it there. Exhale as you extend opposite arm and leg. Never rush. If your back lifts, your range is too big.",
      purpose:"Deep core stability. Directly addresses why your lower back hurts when bending: these stabilizers are undertrained."},
    {name:"Glute bridge — 2 sec hold",dose:"2 × 15",tags:["hip","core"],
      cues:"Drive through heels. Squeeze glutes hard at the top — not your lower back. Keep ribs down. Hold 2 sec. Lower with control.",
      purpose:"Glute activation and APT correction. Weak glutes allow hip flexors to dominate, tipping the pelvis forward."},
    {name:"Wrist CARs + loaded wrist prep",dose:"10 circles each direction + 10 sec compression hold",tags:["handstand","mobility"],
      cues:"CARs: slow full circles at the wrist joint only. Then: place both palms flat on floor, fingers forward. Lean weight progressively into wrists. Comfortable — not painful.",
      purpose:"Non-negotiable handstand prerequisite. Wrist injuries are the #1 reason people plateau on handstands. Build joint capacity now."},
  ]},
  {name:"Prehab strength",time:"~12 min",sub:"Build muscles and tendons that keep joints healthy for decades. Movements your regular lifting misses.",exercises:[
    {name:"Wall glides — serratus anterior",dose:"3 × 12",tags:["shoulder","handstand"],
      cues:"Stand facing a wall, forearms on the wall at shoulder height. Without moving your feet, slide your forearms up the wall as high as possible — let your shoulder blades spread apart and rise (protract and elevate). Pause at the top. Slowly slide back down and let the shoulder blades retract fully at the bottom. No shrugging with the neck.",
      purpose:"Serratus anterior is the primary scapular stabilizer and most undertrained shoulder muscle. Wall glides train protraction and scapular upward rotation — essential for handstand stability and overhead longevity."},
    {name:"Copenhagen plank — adductor",dose:"2 × 20 sec each side",tags:["hip","knee"],
      cues:"Side plank with top leg resting on bench at the knee. Bottom leg lifts slightly off the floor. Keep hips square and stacked — don't rotate.",
      purpose:"Adductor/groin strength — most undertrained muscle group in soccer athletes. Groin strains are the #2 most common soccer injury. Direct prevention."},
    {name:"Pike push-up",dose:"3 × 8",tags:["handstand","shoulder"],
      cues:"Hands shoulder-width, hips high in an inverted V. Bend elbows to lower your head toward the floor. Push back up. At the top: push the floor away and shrug your shoulders up (scapular elevation). This shrug is everything for handstand.",
      purpose:"Overhead pressing strength in the handstand-specific pattern. The scapular shrug teaches the active shoulder position that keeps you stable inverted."},
    {name:"Kettlebell bench tib raises",dose:"3 × 20 each leg",tags:["ankle","knee"],
      cues:"Sit on a bench, leg extended. Rest a kettlebell on top of your foot. Dorsiflex — pull toes up as high as possible against the weight. Hold 1 sec at the top. Lower slowly. Keep the movement controlled throughout — no swinging.",
      purpose:"Loaded tibialis anterior training. Shin splint prevention, ankle stability, and directly improves dorsiflexion range for your squat."},
  ]},
  {name:"Skill work",time:"~20 min",sub:"Handstand and split progressions. Placed after strength work while the body is warm but not exhausted.",exercises:[
    {name:"Wall handstand — chest to wall",dose:"3 × max hold (build to 30 sec)",tags:["handstand"],
      cues:"Walk feet up the wall until your BELLY faces it — NOT your back. Hollow body, ribs in, hips over shoulders over wrists. At the top: push the floor away, shrug shoulders into your ears (active scapulae). Peel feet off the wall slightly to find the balance point.",
      purpose:"Chest-to-wall is the correct alignment drill. Back-to-wall creates a banana shape that won't transfer to freestanding. The scapular shrug is the single most important handstand skill."},
    {name:"Scapular shrugs — handstand",dose:"3 × 10",tags:["handstand","shoulder"],
      cues:"In your chest-to-wall handstand: from fully active (shrugged) shoulders, slowly let yourself lower (depress scapulae) then push back up (elevate). Small movement, enormous neurological demand. Stay controlled.",
      purpose:"Teaches active control of shoulder elevation and depression while inverted — what separates a shaky handstand from a solid one."},
    {name:"Pigeon stretch",dose:"60 sec each side",tags:["hip","splits"],
      cues:"From a push-up position, bring one knee forward toward your wrist, shin angled across the mat. Extend the back leg straight. Hips square — don't let them tilt. Sink your weight down and forward over the front shin. Breathe into the outer hip.",
      purpose:"Deep hip external rotation stretch — directly targets the hip capsule restrictions that limit split depth. Hip opener before all split work."},
    {name:"Kneeling lunge",dose:"60 sec each side",tags:["splits","hip"],
      cues:"Posterior pelvic tilt FIRST — tuck your tailbone before leaning forward. Then lean forward from the hip. Feel it deep in the front hip of the back leg, not your lower back. Progressively slide the front foot forward each week.",
      purpose:"Hip flexor length is the primary limiter of your front split. The pelvic tilt cue is critical — without it you're just arching your lower back, not actually stretching the hip flexor."},
    {name:"Kneeling quad stretch",dose:"60 sec each side",tags:["splits","hip","knee"],
      cues:"From a kneeling position, reach back and grab your back foot, pulling it toward your glute. Keep your hips pushed forward and torso upright — don't let the hip drop back. Squeeze the glute of the kneeling leg to increase the stretch.",
      purpose:"Rectus femoris flexibility — this muscle limits both knee flexion and hip extension simultaneously. Essential for full front split depth and knee health."},
    {name:"Pancake stretch",dose:"60 sec",tags:["splits","hip"],
      cues:"Seated straddle. Hinge forward from the hips — not the spine. Keep spine long. Walk hands forward. Each session try to get chest a little closer to the floor. Breathe out to release deeper.",
      purpose:"Builds adductor and inner hamstring flexibility required for front splits. Also improves Copenhagen plank strength and hip mobility range."},
    {name:"Active front split + leg lifts",dose:"2 × 30 sec hold + 5 active lifts each side",tags:["splits","hip"],
      cues:"Get as low as comfortable — use yoga blocks under the front hip if needed. Hold. Then: without changing your pelvis position, actively lift the front heel off the floor 5 times. The lift is what builds active flexibility.",
      purpose:"The passive stretch gets you into the split; the active lifts build strength to hold and use that range. Active flexibility, not just static lengthening."},
  ]},
  {name:"Cool-down",time:"~8 min",sub:"Return the nervous system to baseline and lock in the range you just worked.",exercises:[
    {name:"Child's pose — lateral reach",dose:"60 sec each side",tags:["spine","shoulder"],
      cues:"Walk hands to each side to reach the lat and shoulder. Breathe into the stretch. Let hips sink toward heels.",
      purpose:"Lumbar decompression and lat stretch. Tight lats contribute directly to your towel test limitation and rounded shoulder posture."},
    {name:"Supine thoracic twist",dose:"5 × 5 sec each side",tags:["spine","mobility"],
      cues:"Knees stacked, both arms out. Let gravity rotate the spine — don't force it. Feel the rotation through the mid-back, not the lumbar. Breathe out to release slightly deeper each rep.",
      purpose:"End-range thoracic rotation and decompression. Reinforces rotation range gained during the session."},
    {name:"Diaphragmatic breathing",dose:"8 slow breaths",tags:["core","spine"],
      cues:"One hand on chest, one on belly. Breathe so only the belly hand rises — rib cage expands 360° including into the floor. Exhale fully. No rush.",
      purpose:"Nervous system reset after a demanding session. Also directly improves thoracic mobility over time. Lets the whole session consolidate."},
  ]},
];

const liftingDays=[
  {name:"Day A",sub:"Weighted pull-ups · chest supported row · incline bench · lateral raises · biceps",
   note:"Rest 2 min between sets. Log your pull-up weight every session — when you hit 6 clean reps on all 3 sets, add 2.5 kg next session.",
   timing:[{l:"Warm-up",v:"10 min"},{l:"Working sets",v:"~52 min"},{l:"Buffer",v:"10 min"},{l:"Total",v:"~72 min"}],
   sections:[
    {label:"Back",exercises:[
      {name:"Weighted pull-ups",dose:"3 × 5–6 reps",tags:["back"],badge:"wt",
        cues:"Attach a plate or use a dip belt. Full dead hang at the bottom. Depress the scapulae before bending the elbows. Drive elbows to hips. Chin clears the bar. Lower slowly — 3 sec eccentric. If form breaks, strip the weight.",
        purpose:"Primary vertical pull with progressive overload. The main long-term strength progression vehicle in this plan."},
      {name:"Chest supported row — incline machine",dose:"2 × 10–12 reps",tags:["back"],
        cues:"Chest firmly on the pad — no peeling off to generate momentum. Squeeze shoulder blades together at the top and hold 1 sec. Full stretch at the bottom — let the weight pull your arms forward before each rep. Control the return.",
        purpose:"Strict horizontal mid-back and rhomboid work. The machine removes all lower back compensation — pure upper back loading."},
    ]},
    {label:"Chest",exercises:[
      {name:"Incline barbell bench press",dose:"2 × 8–10 reps",tags:["chest"],
        cues:"Bench at 30–45°. Retract and depress scapulae into the bench — keep them pinned. Bar touches upper chest. 2 sec descent. Drive through your hands, not just your chest.",
        purpose:"Primary upper chest builder. Incline angle shifts stress to the upper pec and front delt for more balanced development."},
    ]},
    {label:"Shoulders",exercises:[
      {name:"Lateral raise",dose:"2 × 15 reps",tags:["shoulder"],
        cues:"Slight forward lean. Lead with elbows not wrists. Raise to shoulder height only — going higher traps the rotator cuff. 3 sec descent. Slight internal rotation (pinky up) to bias the lateral head.",
        purpose:"Lateral delt width. Placed on Days A and C to build shoulder volume without overlapping pressing recovery."},
    ]},
    {label:"Biceps — your choice",exercises:[
      {name:"Bicep exercise — your choice",dose:"2 × 10–12 reps",tags:["arms","choice"],isChoice:true,

const phaseColors=["#e0e0e0","#60a8f0","#f0a060","#f07060","#a078f0","#50d0b0"];
const dayColors=["#e0e0e0","#60a8f0","#f0a060"];
let gnum=0;

function buildCard(ex,num,padded){
  const tags=ex.tags.map(t=>`<span class="tag t-${t}">${t}</span>`).join('');
  const badge=ex.badge==='wt'?`<span class="badge badge-wt">+ weight</span>`:ex.badge==='exp'?`<span class="badge badge-exp">explosive</span>`:'';
  const choice=ex.isChoice?`<div class="choice-box"><div class="choice-label">Options</div><div class="choice-opts">${ex.options}</div></div>`:'';
  const wrap=padded?'lpad':'';
  return `<div class="${wrap}"><div class="excard" id="ex${num}" onclick="tog(${num})">
    <div class="ex-head">
      <span class="ex-num">${num}</span>
      <div class="ex-main">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-dose">${ex.dose}</div>
        <div class="ex-tags">${tags}</div>
        ${badge?`<div class="ex-badges">${badge}</div>`:''}
      </div>
      <div class="ex-chevron">⌄</div>
    </div>
    <div class="ex-body">
      <div class="ex-section"><div class="ex-blabel">Coaching cues</div><div class="ex-btext bright">${ex.cues}</div></div>
      <div class="ex-section"><div class="ex-blabel">Why it's here</div><div class="ex-btext">${ex.purpose}</div></div>
      ${choice}
    </div>
  </div></div>`;
}

function buildPrehab(){
  const tabs=document.getElementById('prehab-tabs');
  const panels=document.getElementById('prehab-panels');
  prehabPhases.forEach((ph,pi)=>{
    const tb=document.createElement('button');
    tb.className='tab-pill'+(pi===0?' on':'');
    tb.innerHTML=`<span style="width:6px;height:6px;border-radius:50%;background:${phaseColors[pi]};display:inline-block"></span>${ph.name}`;
    tb.onclick=()=>swTab('prehab',pi);
    tabs.appendChild(tb);
    const p=document.createElement('div');
    p.className='phase-panel'+(pi===0?' on':'');
    p.id=`prehab-panel-${pi}`;
    let h=`<div class="phase-header"><div class="phase-name">${ph.name}</div><div class="phase-sub">${ph.sub}</div><div class="phase-time"><span style="color:${phaseColors[pi]}">●</span> <strong>${ph.time}</strong></div></div>`;
    ph.exercises.forEach(ex=>{gnum++;h+=buildCard(ex,gnum,false);});
    p.innerHTML=h;panels.appendChild(p);
  });
}

function buildLifting(){
  const tabs=document.getElementById('lifting-tabs');
  const panels=document.getElementById('lifting-panels');
  liftingDays.forEach((day,di)=>{
    const tb=document.createElement('button');
    tb.className='tab-pill'+(di===0?' on':'');
    tb.innerHTML=`<span style="width:6px;height:6px;border-radius:50%;background:${dayColors[di]};display:inline-block"></span>${day.name}`;
    tb.onclick=()=>swTab('lifting',di);
    tabs.appendChild(tb);
    const p=document.createElement('div');
    p.className='phase-panel'+(di===0?' on':'');
    p.id=`lifting-panel-${di}`;
    let chips='<div class="timing-chips">';
    day.timing.forEach(t=>{chips+=`<div class="tchip">${t.l}: <strong>${t.v}</strong></div>`;});
    chips+='</div>';
    let h=`<div class="phase-header" style="padding:12px 16px 0"><div class="phase-name">${day.name}</div><div class="phase-sub">${day.sub}</div></div>${chips}<div class="lpad"><div class="infobar">${day.note}</div></div>`;
    day.sections.forEach(sec=>{
      h+=`<div class="sec-label lpad">${sec.label}</div>`;
      sec.exercises.forEach(ex=>{gnum++;h+=buildCard(ex,gnum,true);});
    });
    p.innerHTML=h;panels.appendChild(p);
  });
}

function tog(n){document.getElementById('ex'+n).classList.toggle('open');}
function swTab(plan,idx){
  document.querySelectorAll(`[id^="${plan}-panel-"]`).forEach((p,i)=>p.classList.toggle('on',i===idx));
  const t=document.getElementById(plan+'-tabs');
  t.querySelectorAll('.tab-pill').forEach((tb,i)=>tb.classList.toggle('on',i===idx));
  t.querySelectorAll('.tab-pill')[idx]?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}
function switchPlan(plan){
  document.querySelectorAll('.plan-view').forEach(p=>p.classList.remove('on'));
  document.getElementById('plan-'+plan).classList.add('on');
  document.querySelectorAll('.psw').forEach((b,i)=>b.classList.toggle('on',(i===0&&plan==='prehab')||(i===1&&plan==='lifting')));
}
buildPrehab();buildLifting();
</script>
